# Each top-level key is the method name (matches --method on the CLI
# and the key used in the APPROACH_REGISTRY in run_grid_search.py).

Gplearn:
  population_size: [200, 500, 1000, 2000]
  generations: [50, 100, 200, 500]
  tournament_size: [5, 10, 20, 50]
  p_crossover: [0.6, 0.7, 0.8, 0.9]
  p_subtree_mutation: [0.05, 0.1, 0.15, 0.2]
  parsimony_coefficient: [0.0001, 0.001, 0.01, 0.1]

Operon:
  population_size: [250, 500, 1000, 2000]
  allowed_evaluations: [50000, 100000, 250000, 500000]
  crossover_probability: [0.6, 0.7, 0.8, 0.9]
  mutation_probability: [0.1, 0.15, 0.2, 0.25]
  max_length: [10, 15, 25, 50]

PySR:
  population_size: [30, 100, 250, 500]
  ncycles_per_iteration: [200, 500, 1000, 2000]
  maxsize: [15, 20, 25, 30]
  maxdepth: [5, 8, 12, 15]
  parsimony: [0.0001, 0.001, 0.005, 0.01]
  niterations: [50, 100, 200, 500]

GPGOMEA:
  population_size: [100, 250, 500, 1000]
  generations: [50, 100, 200, 500]
  max_tree_size: [15, 31, 63, 127]

MRGP:
