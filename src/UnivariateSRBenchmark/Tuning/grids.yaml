# Each top-level key is the method name (matches --method on the CLI
# and the key used in the APPROACH_REGISTRY in run_grid_search.py).

Gplearn:
  population_size: [200, 500, 1000, 2000]
  generations: [100, 200, 500]
  tournament_size: [10, 20, 50]
  p_crossover: [0.6, 0.7, 0.8]
  p_subtree_mutation: [0.05, 0.1, 0.2]
  parsimony_coefficient: [0.0001, 0.001, 0.01, 0.1]

Operon:
  population_size: [250, 500, 1000, 2000]
  allowed_evaluations: [50000, 100000, 250000, 500000]
  crossover_probability: [0.6, 0.7, 0.8]
  mutation_probability: [0.1, 0.15, 0.2, 0.25]
  max_length: [15, 25, 50]

PySR:
  population_size: [30, 100, 250, 500]
  ncycles_per_iteration: [500, 1000, 2000]
  maxsize: [20, 25, 30]
  maxdepth: [5, 10, 15]
  parsimony: [0.0001, 0.001, 0.005, 0.01]
  niterations: [100, 200, 500]

GPGOMEA:
  population_size: [100, 250, 500, 1000]
  generations: [50, 100, 200, 500]
  max_tree_size: [15, 31, 63, 127]

MRGP:
  population_size: [200, 500, 1000, 2000]
  generations: [50, 100, 250, 500]
  crossover_rate: [0.5, 0.7, 0.8]
  mutation_rate: [0.05, 0.1, 0.15, 0.2]
  lasso_lambda: [0.001, 0.01, 0.1, 0.5]

EPLEX:
  population_size: [100, 250, 500, 1000]
  generations: [50, 100, 200, 300]
  crossover_rate: [0.6, 0.7, 0.8]
  mutation_rate: [0.05, 0.1, 0.15, 0.2]
  lexicase_epsilon: [0.01, 0.05, 0.1, 0.2]

FEAT:
  pop_size: [100, 250, 500, 1000]
  gens: [50, 100, 250, 500]
  archive_size: [10, 20, 50, 100]
  complexity_weight: [0.001, 0.01, 0.1, 0.5]
  mutation_rate: [0.05, 0.1, 0.15, 0.2]

ITEA:
  pop_size: [100, 250, 500, 1000]
  gens: [50, 100, 200, 500]
  max_terms: [5, 10, 15, 20]
  max_exponent: [2, 3, 4]

