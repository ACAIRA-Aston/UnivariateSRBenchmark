# Installed from https://github.com/dso-org/deep-symbolic-optimization-pytorch:
#pip install numpy==1.26.4 (there are many things to fix within DSO if this numpy version is not used)
#pip install --no-build-isolation -e ./dso
DSR:
  n_samples: [100000, 500000, 1000000]
  lr: [0.0003, 0.0005, 0.001, 0.01]
  risk: [0.05, 0.10, 0.15, 0.5]
UDSR:
  n_samples: [ 100000, 500000, 1000000 ]
  lr: [ 0.0003, 0.0005, 0.001, 0.01 ]
  risk: [ 0.05, 0.10, 0.15, 0.5 ]

E2E:
  B: [50, 100, 200]  # num_bags
  C: [1, 5, 10]  # beam_size
  K: [1, 5, 10]  # k_top

TPSR:
  lambda_reg: [0.01, 0.1, 1.0, 5.0]
  width: [2, 3, 4]
  rollout: [1, 3, 6, 9]
  beams: [1, 3]

TaylorGP:
  population_size: [100, 200, 500]
  generations: [50, 100, 200, 500]
  crossover_rate: [0.6, 0.7, 0.8]
  mutation_rate: [0.05, 0.1, 0.15, 0.2]

